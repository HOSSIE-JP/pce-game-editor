appId: jp.co.geroneko.pce.editor.desktop
productName: PCEGameEditor
copyright: "Copyright © 2026 HOSSIE"
publish: null
files:
  - "*.js"
  - build-meta.json
  - "!node_modules/wasm-media-encoders/**"
  - "!node_modules/@swc/helpers/**"
  - "!node_modules/tslib/**"
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
  - third_party/**
  - "!**/.git/**"
  - "!**/.DS_Store"
  - renderer/**
  - build/icon.png
  - build/icon.ico
extraResources:
  - from: plugins
    to: plugins
    filter:
      - "**/*"
      - "!**/.git/**"
      - "!**/node_modules/**"
      - "!**/__pycache__/**"
  - from: template
    to: template
    filter:
      - "**/*"
      - "!**/.git/**"
      - "!**/node_modules/**"
      - "!**/__pycache__/**"
      - "!**/out/**"
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: licenses
    to: licenses
    filter:
      - "**/*"
      - "!**/.git/**"
      - "!**/node_modules/**"
      - "!**/__pycache__/**"
extraMetadata:
  main: main.js
mac:
  icon: build/icon.icns
  target:
    - dmg
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
directories:
  output: dist

portable:
  artifactName: "PCEGameEditor-${version}-Portable-${arch}.exe"
  useZip: true
  requestExecutionLevel: user
afterPack: scripts/verify-distribution.js
