appId: jp.co.geroneko.pce.editor.desktop
productName: PCEGameEditor
copyright: "Copyright © 2026 HOSSIE"
files:
  - "*.js"
  - "!node_modules/wasm-media-encoders/**"
  - "!node_modules/@swc/helpers/**"
  - "!node_modules/tslib/**"
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
  - renderer/**
  - build/icon.png
  - build/icon.ico
extraResources:
  - from: plugins
    to: plugins
    filter:
      - "**/*"
  - from: template
    to: template
    filter:
      - "**/*"
      - "!**/out/**"
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: licenses
    to: licenses
    filter:
      - "**/*"
extraFiles:
  - from: build/portable
    to: portable
extraMetadata:
  main: main.js
mac:
  icon: build/icon.icns
  target:
    - dmg
win:
  icon: build/icon.ico
  target:
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: dist

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # installerのアイコンも指定したい場合
  installerIcon: ./build/icon.ico
